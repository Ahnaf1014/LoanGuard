<!doctype html>
<html lang="en">
  <head>
    <!-- Shared document shell. Feature templates fill the content block below. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LoanGuard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Global navigation keeps the three primary feature areas discoverable. -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/"> LoanGuard </a>

        <div>
          <a class="btn btn-outline-light me-2" href="/borrowers">
            Borrowers
          </a>

          <a class="btn btn-outline-light me-2" href="/applications">
            Applications
          </a>

          <a class="btn btn-outline-light" href="/assessments">
            Assessments
          </a>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      <!-- Routes use Flask flash messages to report database operations. -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}

      <div
        class="alert alert-{{ category }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>

      {% endfor %} {% endif %} {% endwith %}
    </div>

    <!-- Each feature template supplies its page-specific interface here. -->
    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
