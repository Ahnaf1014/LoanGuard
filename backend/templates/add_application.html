{% extends "base.html" %}
{% block title %}New Application | LoanGuard{% endblock %}
{% block content %}

<div class="form-card content-card p-4">
  <div class="mb-4">
    <p class="page-eyebrow mb-1">Application management</p>
    <h1 class="h3 page-title mb-1">New loan application</h1>
    <p class="page-subtitle mb-0">Assign a borrower and loan officer, then record the request.</p>
  </div>

  <form method="post" class="row g-3">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

    <div class="col-md-6">
      <label class="form-label" for="borrower_id">Borrower</label>
      <select class="form-select" id="borrower_id" name="borrower_id" required>
        <option value="" selected disabled>Select a borrower</option>
        {% for borrower in borrowers %}
        <option value="{{ borrower.borrower_id }}">{{ borrower.first_name }} {{ borrower.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="loan_officer_id">Loan officer</label>
      <select class="form-select" id="loan_officer_id" name="loan_officer_id" required>
        <option value="" selected disabled>Select a loan officer</option>
        {% for officer in loan_officers %}
        <option value="{{ officer.staff_id }}">{{ officer.first_name }} {{ officer.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="application_date">Application date</label>
      <input class="form-control" id="application_date" type="date" name="application_date" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="requested_amount">Requested amount</label>
      <input class="form-control" id="requested_amount" type="number" step="0.01" min="0.01" name="requested_amount" placeholder="e.g. 10000.00" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="occupation">Occupation</label>
      <input class="form-control" id="occupation" name="occupation" maxlength="100" placeholder="e.g. Software engineer" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="monthly_income">Monthly income</label>
      <input class="form-control" id="monthly_income" type="number" step="0.01" min="0.01" name="monthly_income" placeholder="e.g. 5000.00" required />
    </div>
    <div class="col-12">
      <label class="form-label" for="loan_purpose">Loan purpose</label>
      <input class="form-control" id="loan_purpose" name="loan_purpose" maxlength="255" placeholder="e.g. Home renovation" required />
    </div>

    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-success">Submit application</button>
      <a class="btn btn-secondary" href="{{ url_for('application.applications') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
