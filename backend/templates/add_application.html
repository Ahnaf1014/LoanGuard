{% extends "base.html" %} {% block content %}

<!-- New applications start with no manager decision; manager_id is stored as NULL. -->
    <h2 class="mb-3">New Loan Application</h2>

    <form method="POST">
      <label for="borrower_id">Borrower</label>

      <!-- Dropdown choices are limited to records retrieved from MySQL. -->
      <select id="borrower_id" name="borrower_id" required>
        {% for borrower in borrowers %}

        <option value="{{ borrower.borrower_id }}">
          {{ borrower.first_name }} {{ borrower.last_name }}
        </option>

        {% endfor %}
      </select>

      <br /><br />

      <label for="loan_officer_id">Loan Officer</label>

      <select id="loan_officer_id" name="loan_officer_id" required>
        {% for officer in loan_officers %}

        <option value="{{ officer.staff_id }}">
          {{ officer.first_name }} {{ officer.last_name }}
        </option>

        {% endfor %}
      </select>

      <br /><br />

      <label for="application_date">Application Date</label>

      <input
        id="application_date"
        type="date"
        name="application_date"
        title="Application date"
        required
      />

      <br /><br />

      <label for="requested_amount">Requested Amount</label>

      <input
        id="requested_amount"
        type="number"
        step="0.01"
        min="0.01"
        name="requested_amount"
        title="Requested amount"
        placeholder="e.g. 10000.00"
        required
      />

      <br /><br />

      <!-- Income and occupation are used by the later credit-assessment process. -->
      <label for="occupation">Occupation</label>

      <input
        id="occupation"
        type="text"
        name="occupation"
        title="Occupation"
        placeholder="e.g. Software Engineer"
        required
      />

      <br /><br />

      <label for="monthly_income">Monthly Income</label>

      <input
        id="monthly_income"
        type="number"
        step="0.01"
        min="0.01"
        name="monthly_income"
        title="Monthly income"
        placeholder="e.g. 5000.00"
        required
      />

      <br /><br />

      <label for="loan_purpose">Loan Purpose</label>

      <input
        id="loan_purpose"
        type="text"
        name="loan_purpose"
        title="Loan purpose"
        placeholder="e.g. Home renovation"
        required
      />

      <br /><br />

      <button type="submit" class="btn btn-success">Submit Application</button>
      <a class="btn btn-secondary" href="{{ url_for('application.applications') }}">Cancel</a>
    </form>
{% endblock %}
