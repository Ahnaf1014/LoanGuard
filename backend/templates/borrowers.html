{% extends "base.html" %} {% block content %}

<h2 class="mb-3">Borrowers</h2>

<a href="/borrowers/add" class="btn btn-primary mb-3"> Add Borrower </a>

<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th width="180">Actions</th>
    </tr>
  </thead>

  <tbody>
    {% for borrower in borrowers %}

    <tr>
      <td>{{ borrower.borrower_id }}</td>

      <td>{{ borrower.first_name }} {{ borrower.last_name }}</td>

      <td>{{ borrower.email }}</td>

      <td>
        <a
          class="btn btn-warning btn-sm"
          href="/borrowers/edit/{{ borrower.borrower_id }}"
        >
          Edit
        </a>

        <a
          class="btn btn-danger btn-sm"
          href="/borrowers/delete/{{ borrower.borrower_id }}"
          onclick="return confirm('Delete this borrower?');"
        >
          Delete
        </a>
      </td>
    </tr>

    {% endfor %}
  </tbody>
</table>

{% endblock %}
