{% extends "base.html" %} {% block content %}

<!-- Borrower directory; values are supplied by routes/borrower.py. -->
<h2 class="mb-3">Borrowers</h2>

<a href="{{ url_for('borrower.add_borrower') }}" class="btn btn-primary mb-3">Add Borrower</a>

<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th width="180">Actions</th>
    </tr>
  </thead>

  <tbody>
    {% for borrower in borrowers %}

    <tr>
      <td>{{ borrower.borrower_id }}</td>

      <td>{{ borrower.first_name }} {{ borrower.last_name }}</td>

      <td>{{ borrower.email }}</td>

      <td>
        <!-- Editing is safe to navigate with GET; deletion requires POST below. -->
        <a
          class="btn btn-warning btn-sm"
          href="{{ url_for('borrower.edit_borrower', borrower_id=borrower.borrower_id) }}"
        >
          Edit
        </a>

        <form
          method="post"
          action="{{ url_for('borrower.delete_borrower', borrower_id=borrower.borrower_id) }}"
          class="d-inline"
          data-confirm="Delete this borrower?"
        >
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
          <!-- The confirmation prevents accidental clicks. The server still
               enforces foreign-key rules before committing the deletion. -->
          <button class="btn btn-danger btn-sm" type="submit">Delete</button>
        </form>
      </td>
    </tr>

    {% endfor %}
  </tbody>
</table>

{% endblock %}
