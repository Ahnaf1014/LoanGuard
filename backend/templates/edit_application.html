{% extends "base.html" %} {% block content %}

<h2>Update Application Status</h2>

<form method="POST">
  <div class="mb-3">
    <label class="form-label" for="application_status">Status</label>

    <select
      class="form-select"
      id="application_status"
      name="application_status"
      title="Application Status"
    >
      <option
        value="Pending"
        {%
        if
        application.application_status=""
        ="Pending"
        %}
        selected
        {%
        endif
        %}
      >
        Pending
      </option>

      <option
        value="Under Review"
        {%
        if
        application.application_status=""
        ="Under Review"
        %}
        selected
        {%
        endif
        %}
      >
        Under Review
      </option>

      <option
        value="Approved"
        {%
        if
        application.application_status=""
        ="Approved"
        %}
        selected
        {%
        endif
        %}
      >
        Approved
      </option>

      <option
        value="Rejected"
        {%
        if
        application.application_status=""
        ="Rejected"
        %}
        selected
        {%
        endif
        %}
      >
        Rejected
      </option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>

  <a href="/applications" class="btn btn-secondary"> Cancel </a>
</form>

{% endblock %}
