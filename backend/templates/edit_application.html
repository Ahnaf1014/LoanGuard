{% extends "base.html" %} {% block content %}

<!-- The select mirrors the LOAN_APPLICATION.application_status enum in schema.sql. -->
<h2>Update Application Status</h2>

<form method="POST">
  <div class="mb-3">
    <label for="application_status" class="form-label">Status</label>

    <select class="form-select" id="application_status" name="application_status">

    <option value="Pending" {{ 'selected' if application.application_status == 'Pending' else '' }}>
        Pending
    </option>

    <option value="Under Review" {{ 'selected' if application.application_status == 'Under Review' else '' }}>
        Under Review
    </option>

    <option value="Approved" {{ 'selected' if application.application_status == 'Approved' else '' }}>
        Approved
    </option>

    <option value="Rejected" {{ 'selected' if application.application_status == 'Rejected' else '' }}>
        Rejected
    </option>

</select>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>

  <a href="/applications" class="btn btn-secondary"> Cancel </a>
</form>

{% endblock %}
