{% extends "base.html" %}
{% block title %}Add Borrower | LoanGuard{% endblock %}
{% block content %}

<div class="form-card content-card p-4">
  <div class="mb-4">
    <p class="page-eyebrow mb-1">Borrower management</p>
    <h1 class="h3 page-title mb-1">Add borrower</h1>
    <p class="page-subtitle mb-0">Create the identity record used by future applications.</p>
  </div>

  <form method="post" class="row g-3">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

    <div class="col-md-6">
      <label class="form-label" for="first_name">First name</label>
      <input class="form-control" id="first_name" name="first_name" maxlength="50" autocomplete="given-name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="last_name">Last name</label>
      <input class="form-control" id="last_name" name="last_name" maxlength="50" autocomplete="family-name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="nid">National ID (NID)</label>
      <input class="form-control" id="nid" name="nid" maxlength="20" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" maxlength="100" autocomplete="email" required />
    </div>

    <div class="col-12 mt-4">
      <p class="form-section-title mb-0">Address <span class="fw-normal text-secondary">(optional)</span></p>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="house_no">House number</label>
      <input class="form-control" id="house_no" name="house_no" maxlength="20" autocomplete="address-line1" />
    </div>
    <div class="col-md-8">
      <label class="form-label" for="street">Street</label>
      <input class="form-control" id="street" name="street" maxlength="100" autocomplete="address-line2" />
    </div>
    <div class="col-md-8">
      <label class="form-label" for="city">City</label>
      <input class="form-control" id="city" name="city" maxlength="50" autocomplete="address-level2" />
    </div>
    <div class="col-md-4">
      <label class="form-label" for="postal_code">Postal code</label>
      <input class="form-control" id="postal_code" name="postal_code" maxlength="10" autocomplete="postal-code" />
    </div>

    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-primary">Save borrower</button>
      <a class="btn btn-secondary" href="{{ url_for('borrower.borrowers') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
