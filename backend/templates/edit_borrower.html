{% extends "base.html" %}
{% block title %}Edit Borrower | LoanGuard{% endblock %}
{% block content %}

<div class="form-card content-card p-4">
  <div class="mb-4">
    <p class="page-eyebrow mb-1">Borrower #{{ borrower.borrower_id }}</p>
    <h1 class="h3 page-title mb-1">Edit borrower</h1>
    <p class="page-subtitle mb-0">Update identity and contact information.</p>
  </div>

  <form method="post" class="row g-3">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

    <div class="col-md-6">
      <label class="form-label" for="first_name">First name</label>
      <input class="form-control" id="first_name" name="first_name" value="{{ borrower.first_name }}" maxlength="50" autocomplete="given-name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="last_name">Last name</label>
      <input class="form-control" id="last_name" name="last_name" value="{{ borrower.last_name }}" maxlength="50" autocomplete="family-name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="nid">National ID (NID)</label>
      <input class="form-control" id="nid" name="nid" value="{{ borrower.nid }}" maxlength="20" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" value="{{ borrower.email }}" maxlength="100" autocomplete="email" required />
    </div>
    <div class="col-md-4">
      <label class="form-label" for="house_no">House number</label>
      <input class="form-control" id="house_no" name="house_no" value="{{ borrower.house_no or '' }}" maxlength="20" autocomplete="address-line1" />
    </div>
    <div class="col-md-8">
      <label class="form-label" for="street">Street</label>
      <input class="form-control" id="street" name="street" value="{{ borrower.street or '' }}" maxlength="100" autocomplete="address-line2" />
    </div>
    <div class="col-md-8">
      <label class="form-label" for="city">City</label>
      <input class="form-control" id="city" name="city" value="{{ borrower.city or '' }}" maxlength="50" autocomplete="address-level2" />
    </div>
    <div class="col-md-4">
      <label class="form-label" for="postal_code">Postal code</label>
      <input class="form-control" id="postal_code" name="postal_code" value="{{ borrower.postal_code or '' }}" maxlength="10" autocomplete="postal-code" />
    </div>

    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-secondary" href="{{ url_for('borrower.borrowers') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
