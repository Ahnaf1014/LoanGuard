{% extends "layouts/base.html" %}
{% block title %}Add Assessment | LoanGuard{% endblock %}
{% block content %}

<div class="form-card content-card p-4">
  <div class="mb-4">
    <p class="page-eyebrow mb-1">Credit review</p>
    <h1 class="h3 page-title mb-1">Add credit assessment</h1>
    <p class="page-subtitle mb-0">Record an analyst's risk evaluation and recommendation.</p>
  </div>

  <form method="post" class="row g-3">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

    <div class="col-md-8">
      <label class="form-label" for="application_id">Application</label>
      <select class="form-select" id="application_id" name="application_id" required>
        <option value="" selected disabled>Select an application</option>
        {% for application in applications %}
        <option value="{{ application.application_id }}">#{{ application.application_id }} — {{ application.borrower_name }} ({{ application.application_status }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="analyst_id">Credit analyst</label>
      <select class="form-select" id="analyst_id" name="analyst_id" required>
        <option value="" selected disabled>Select an analyst</option>
        {% for analyst in analysts %}
        <option value="{{ analyst.staff_id }}">{{ analyst.first_name }} {{ analyst.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="assessment_date">Assessment date</label>
      <input class="form-control" id="assessment_date" type="date" name="assessment_date" required />
    </div>
    <div class="col-md-4">
      <label class="form-label" for="credit_score">Credit score</label>
      <input class="form-control" id="credit_score" type="number" min="0" max="850" name="credit_score" required />
    </div>
    <div class="col-md-4">
      <label class="form-label" for="default_probability">Default probability (%)</label>
      <input class="form-control" id="default_probability" type="number" step="0.01" min="0" max="100" name="default_probability" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="risk_level">Risk level</label>
      <select class="form-select" id="risk_level" name="risk_level" required>
        {% for risk_level in risk_levels %}
        <option value="{{ risk_level }}">{{ risk_level }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="recommendation">Recommendation</label>
      <select class="form-select" id="recommendation" name="recommendation" required>
        {% for recommendation in recommendations %}
        <option value="{{ recommendation }}">{{ recommendation }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label" for="remarks">Remarks</label>
      <textarea class="form-control" id="remarks" name="remarks" rows="3" maxlength="4000"></textarea>
    </div>

    <div class="col-12 mt-4">
      <button type="submit" class="btn btn-primary">Save assessment</button>
      <a class="btn btn-secondary" href="{{ url_for('assessment.assessments') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
